<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ed7438"/>
    </radialGradient>
  </defs>
  <!-- outer light-amber ring -->
  <circle cx="50" cy="50" r="50" fill="#f5a623"/>
  <!-- inner orange filled circle (slightly smaller gives rim effect) -->
  <circle cx="50" cy="44" r="44" fill="#ed7438"/>
  <!-- AI text -->
  <text x="50" y="50" font-family="Arial Black,Arial,sans-serif" font-weight="900"
        font-size="34" fill="white" text-anchor="middle" dominant-baseline="middle"
        letter-spacing="-1">AI</text>
  <!-- white divider line -->
  <rect x="0" y="66" width="100" height="3" fill="white" clip-path="url(#c)"/>
  <!-- red band -->
  <rect x="0" y="69" width="100" height="16" fill="#c0392b" clip-path="url(#c)"/>
  <!-- dark maroon base -->
  <rect x="0" y="85" width="100" height="15" fill="#7b1818" clip-path="url(#c)"/>
</svg>